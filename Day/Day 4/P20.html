<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors | classSelector </title>
    <style>
        .style1{
            font-size: 18px;
            background-color: rgb(255, 0, 0);
            color: rgb(255, 255, 255);
        }
        .style2{
            font-size: 18px;
            background-color: rgb(0, 0, 255);
            color: rgb(255, 255, 255);
        }
        .style3{
            font-size: 18px;
            background-color: rgb(0, 255, 0);
            color: rgb(255, 255, 255);
        }
        h1{
            color:blueviolet;
        }
    </style>
</head>
<body>
    <h1 class="style1">classSelector</h1>
    <h1 class="style2">Heading tag itself;but a different style</h1>
    <p class="style3">This is a new paragraph that l've created.</p>
    <p class="style1">This is a new paragraph that l've created.</p>
</body>
</html>
