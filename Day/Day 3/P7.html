<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML validation</title>
</head>
<body>
    <form action="" method="post">
        <fieldset>
            <legend>Personal Information</legend>
            <p>
                <input type="name" name="name" placeholder="Enter your name" required>
                minlength="3" maxlength="20"required>
            </p>
             <p>
                <input type="email" name="email" placeholder="Enter your email"required>
                minlength="3" maxlength="20">
            </p>
             <p>
                <input type="password" name="password" placeholder="Enter your password"required>
                minlength="3" maxlength="20"required>
            </p> 
             <p>
                <input type="number" name="age" placeholder="Enter your age"min="1" max="100"required>
            </p>
            <p>Gender</p>
            <input type="radio" name="gender" id="male" value="male">
            <label for="male">Male</label>
            <input type="radio" name="gender" id="female" value="female">
            <label for="female">Female</label>
             <p>
                <input type="tel" name="phone" id="phone"
                pattern=""[0-9]{3}-[0-9]{2}-[0-9]{3}" placeholder="Enter your phone number"required>
                titel="Phone number format: 123-45-678"
                required
                placeholder="Enter your phone number">
            </p>
            <p>
                <input type="date" id="dob" min=""1990-01-01" max="2005-12-31" required>
            </p>
        </fieldset>
        <fieldset>
            <legend>perfernce</legend>
            <p>
                <input type="radio" name="gender" id="male" value="male">
                <label for="male">Male</label>
                <input type="radio" name="gender" id="female" value="female">
                <label for="female">Female</label>
            </p>
        <p>skills:</p>
        <p>
            <input type="checkbox" name="skills" id="html" value="html">
            <label for="html">HTML</label>
            <input type="checkbox" name="skills" id="css" value="css">
            <label for="css">CSS</label>
            <input type="checkbox" name="skills" id="js" value="js">
            <label for="js">JavaScript</label>
        </p>
        <p>
            <label for="country">Country</label><br>
            <!---Dropdown menu-->
            <select name="country" id="country">
                <option value="India">India</option>
                <option value="USA">USA</option>
                <option value="UK">UK</option>
                <option value="Canada">Canada</option>
                </select>
        </p>
        <p>
            <label for=""message">Message</label><br>
            <textarea name="message" id="message" cols="30" rows="10" cols="30"></textarea>
        </p>
        </fieldset>
        <option value="germany">Germany</option>
        <option value="france">France</option>
        <option value="italy">Italy</option>
    </select>
    </p>
    <p>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </p>
</body>
</html>
