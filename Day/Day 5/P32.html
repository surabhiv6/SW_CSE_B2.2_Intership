<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flexbox | Displat | flex-direction | justify-content</title>
    <style>
        .container 2{
            display:flex;
            border:2px solid oranger;
            gap: 10px;
            padding: 10px;
            flex-direction::after;
            margin-top: 20px;
        }
        .item 3{
            background-color: brown;
            color: blueviolet;
            padding: 15px;
            text-align: center;
        }
        .container 3{
            display:flex;
            border:2px solid orange;
            gap: 10px;
            padding: 10px;
            justify-content::backdrop
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <p>CSS Flexbox: is a one-dimensional layout system designed to arrange and allign items in a cantainer,either in a row or a column. it makes easier to creat responsive,flexible layouts without complex positioning or floats.</p>
    <div class="container">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
    </div>
    <div class="container 2">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
    </div>
    <!---justify-content-->
    <div class="container 3">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
    </div>
</body>
</html>
