<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sibiling selector | Attribute Selector</title>
    <style>
        /* Sibiling Selector */
        h2 + p + p{
            color:blue;
        }
        /* Attribute Selector */
        input[type="text"]{
            border-color:rgb(8, 0, 255);
        }
    </style>
</head>
<body>
   <h2>CSS Selector</h2> 
   <p>Sibiling Selector:Selects the element which are next to each other.</p>
   <p>This is a sibling paragraph.</p>
   <h2>Another Heading</h2>
   <input type="text" name="" id="" placeholder="Enter your name"> 
</body>
</html>
