<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-class Selector</title>
    <style>
        /* Sibiling Selector */
        h2 + p + p{
            color:blue;
        }
        /* Attribute Selector */
        input[type="text"]{
            border-color:rgb(8, 0, 255);
        }
        /* Pseudo-class Selector */
        input:focus{
            background-color:rgb(255, 0, 0);
        }
        a:hover{
            background-color:rgb(0, 255, 0);
        }
    </style>
</head>
<body>
   <h2>CSS Selector</h2> 
   <p>Sibiling Selector:Selects the element which are next to each other.</p>
   <p>This is a sibling paragraph.</p>
   <h2>Another Heading</h2>
   <a href="https://www.google.com" target="_blank">Google</a>
   <input type="text" name="" id="" placeholder="Enter your name"> 
</body>
</html>
