<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS colors</title>
    <style>
        .namesd-colors{
            color:rgb(0, 255, 26);
        }
        .hex{
            color:rgb(155, 97, 97);
        }
        .RGB{
            color:rgb(0, 255, 0);
        }
        .HSL{
            color:rgb(0, 0, 255);
        }
        .GradientColor{
            background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);
        }
    </style>
</head>
<body>
   <p>CSS Colors</p> 
   <ol>
         <li class="named-color">Named color</li>
         <li class="hex-color">Hex color</li>
         <li class="RGB & RGBA">RGB & RGBA</li>
         <li class="HSL & HSLA">HSL & HSLA</li>
         <li class="GradientColor">GradientColor</li>
   </ol>
</body>
</html>
